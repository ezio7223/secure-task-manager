name: CI Pipeline (GitOps)

on:
  push:
    branches:
      - main

jobs:
  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit Scan
        run: bandit -r app/

  sca:
    name: SCA (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Build Docker Image
        run: docker build -t secure-task-manager:test .
      - name: Run Docker Container
        run: docker run -d -p 8000:8000 --name app secure-task-manager:test
      - name: Wait for App to be Ready
        run: sleep 10
      - name: ZAP Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8000'
          fail_action: false # Set to false initially to avoid pipeline failure on false positives

  build-and-update-gitops:
    needs: [sast, sca, dast]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Application Code
        uses: actions/checkout@v3

      - name: Set Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/secure-task-manager:${{ steps.vars.outputs.sha_short }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/secure-task-manager:${{ steps.vars.outputs.sha_short }}

      - name: Update GitOps Repository
        run: |
          # 1. Clone the SECOND repository using the PAT
          git clone https://x-access-token:${{ secrets.GITOPS_PAT }}@github.com/ezio7223/secure-task-manager-gitops.git
          cd secure-task-manager-gitops
          
          # 2. Update the image tag in the GitOps repo
          # Note: Adjust the path if your deployment.yaml is in a different subfolder
          sed -i "s|image:.*|image: ${{ secrets.DOCKER_USERNAME }}/secure-task-manager:${{ steps.vars.outputs.sha_short }}|" GitOps/K8/deployment.yaml
          
          # 3. Push the change back to the GitOps repo
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Update image to ${{ steps.vars.outputs.sha_short }}"
          git push